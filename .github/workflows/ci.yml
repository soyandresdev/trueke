name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Redis real para los tests del WebSocket (la capa en memoria no reproduce sus timeouts).
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env: { SECRET_KEY: ci, DEBUG: "false" }
      - run: uv run pytest
      # Traducciones: el .po debe estar al día con el código y sin textos pendientes.
      # (Que el .mo corresponde al .po lo comprueba apps/accounts/tests/test_i18n.py.)
      - run: sudo apt-get install -y -qq gettext
      - run: |
          uv run python manage.py makemessages -l en --ignore=.venv --ignore="*/tests/*" --ignore="*/migrations/*"
          git diff --exit-code -I 'POT-Creation-Date' -- locale
          test -z "$(msgattrib --untranslated --no-obsolete locale/en/LC_MESSAGES/django.po)"
        env: { SECRET_KEY: ci, DEBUG: "false" }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec oxfmt --check .
      # Los tipos de la API deben estar al día con el backend.
      - run: cd ../backend && uv sync --frozen
      - run: pnpm api:generate && git diff --exit-code -- src/api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
