name: Error
description: Algo no funciona como debería
labels: [error]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué pasó en su lugar.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Entra como vendedora (300 000 0002)
        2. Abre una publicación con oferta
        3. …
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Parte
      options: [Frontend, Backend / API, Tiempo real (WebSocket), Docker / instalación, Otra]
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Navegador, sistema operativo, versión o commit de Trueke, `make dev` o sin Docker.
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Errores de la consola del navegador o de `docker compose logs`. No incluyas datos personales ni códigos OTP reales.
      render: text
