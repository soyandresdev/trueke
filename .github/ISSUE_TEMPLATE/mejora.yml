name: Mejora
description: Una idea para Trueke
labels: [mejora]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Para quién (vendedor, operador, quien despliega) y qué le cuesta hoy.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo lo resolverías. Si hay alternativas, cuéntalas.
    validations:
      required: true
  - type: checkboxes
    id: ayuda
    attributes:
      label: ¿Te animas?
      options:
        - label: Me gustaría hacer el pull request
