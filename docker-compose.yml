# Entorno de desarrollo completo: `make dev`
# Los archivos se guardan en disco (backend/media y backend/private-media). En producción, S3 (ver .env.example).
x-backend: &backend
  build: ./backend
  # brand/images se monta para `make seed` (fotos de las publicaciones de demo).
  volumes: ["./backend:/app", "./brand/images:/brand/images:ro"]
  environment:
    DEBUG: "true"
    SECRET_KEY: dev-insecure-change-me
    DATABASE_URL: postgres://trueke:trueke@db:5432/trueke
    REDIS_URL: redis://redis:6379/0
    OTP_PROVIDER: console
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: trueke, POSTGRES_PASSWORD: trueke, POSTGRES_DB: trueke }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trueke"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A config worker -l info

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_BACKEND_URL: http://backend:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "true"
    # node_modules en un volumen propio: los binarios de macOS no sirven dentro de Linux.
    # brand/ se monta en /brand porque el frontend importa los tokens y el logo desde ../brand.
    volumes: ["./frontend:/app", "frontend_modules:/app/node_modules", "./brand:/brand:ro"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  frontend_modules:
