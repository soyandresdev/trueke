[project]
name = "trueke-backend"
version = "0.1.0"
description = "Backend de Trueke"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.98",
    "celery>=5.6.3",
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "jsonschema>=4.26.0",
    "phonenumbers>=9.0.39",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.7.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
env = [
    "D:SECRET_KEY=test-secret-key-that-is-long-enough-for-hs256",
    "DEBUG=false",
    "DATABASE_URL=sqlite://:memory:",
    "REDIS_URL=",
    "S3_BUCKET=",
    "OTP_PROVIDER=console",
    "OTP_THROTTLE_RATE=1000/hour",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]
