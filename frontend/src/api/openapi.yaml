      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/listings/stats/:
    get:
      operationId: listings_stats_retrieve
      description: Cuántas publicaciones hay en cada estado (pestañas del panel).
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Código de la categoría
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        description: Busca en nombre, descripción y vendedor
      - in: query
        name: status
        schema:
          type: string
        description: Uno o varios estados separados por coma
      tags:
