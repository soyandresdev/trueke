openapi: 3.0.3
info:
  title: Trueke API
  version: 0.1.0
  description: API del marketplace Trueke.
paths:
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: Envía un código de acceso al teléfono.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssued'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResendTooSoon'
          description: ''
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Verifica el código. Si el teléfono no tiene cuenta, la crea.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: Categorías activas con su esquema de campos extra. Pública (la
        usa la landing).
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/listings/:
    get:
      operationId: listings_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Código de la categoría
      - in: query
        name: city
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Busca en nombre, descripción y vendedor
      - in: query
        name: status
        schema:
          type: string
        description: Uno o varios estados separados por coma
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
    post:
      operationId: listings_create
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/listings/{listing_id}/messages/:
    get:
      operationId: listings_messages_list
      description: 'Mensajes de la publicación, del más nuevo al más viejo. Enviar:
        JSON o multipart con adjunto.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: listings_messages_create
      description: 'Mensajes de la publicación, del más nuevo al más viejo. Enviar:
        JSON o multipart con adjunto.'
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/listings/{listing_id}/messages/{id}/attachment/:
    get:
      operationId: listings_messages_attachment_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Archivo
  /api/listings/{listing_id}/messages/read/:
    post:
      operationId: listings_messages_read_create
      description: Marca como leídos los mensajes del otro lado.
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkRead'
          description: ''
  /api/listings/{id}/:
    get:
      operationId: listings_retrieve
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Código de la categoría
      - in: query
        name: city
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this listing.
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: Busca en nombre, descripción y vendedor
      - in: query
        name: status
        schema:
          type: string
        description: Uno o varios estados separados por coma
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
    patch:
      operationId: listings_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this listing.
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedListingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/listings/{id}/accept/:
    post:
      operationId: listings_accept_create
      summary: Accept offer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this listing.
        required: true
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
