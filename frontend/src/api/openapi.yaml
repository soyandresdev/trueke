        y le pague. Solo operadores.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/documents/{kind}/:
    get:
      operationId: users_documents_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Archivo
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        created:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - created
      - refresh
      - user
    AvailableActionsEnum:
      enum:
      - offer
      - accept
      - reject
      - pickup
      - complete
      - cancel
      type: string
      description: |-
        * `offer` - offer
        * `accept` - accept
        * `reject` - reject
        * `pickup` - pickup
        * `complete` - complete
        * `cancel` - cancel
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        fields_schema:
          title: Extra fields
          description: JSON Schema (object type) with the fields specific to the category.
      required:
      - code
      - id
      - name
    ConditionEnum:
      enum:
      - new
      - like_new
      - good
      - fair
      - for_parts
      type: string
      description: |-
        * `new` - New
        * `like_new` - Like new
        * `good` - Good condition
        * `fair` - Some wear
        * `for_parts` - For parts
    DocumentTypeEnum:
      enum:
      - national_id
      - foreign_id
      - passport
      type: string
      description: |-
        * `national_id` - National ID
        * `foreign_id` - Foreign ID
        * `passport` - Passport
    KindEnum:
      enum:
      - listing.create
      - listing.offer
      - listing.accept
      - listing.reject
      - listing.pickup
      - listing.complete
      - listing.cancel
      - message.new
      type: string
      description: |-
        * `listing.create` - New listing
        * `listing.offer` - New offer
        * `listing.accept` - Offer accepted
        * `listing.reject` - Offer declined
        * `listing.pickup` - Pickup arranged
        * `listing.complete` - Sale completed
        * `listing.cancel` - Listing cancelled
        * `message.new` - New messages
    LanguageEnum:
      enum:
      - es
      - en
      type: string
      description: |-
        * `es` - Español
        * `en` - English
    Listing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/Seller'
          readOnly: true
        category:
          type: integer
        title:
          type: string
          title: Name
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        attributes:
          title: Category fields
        city:
          type: string
          maxLength: 80
        pickup_address:
          type: string
          maxLength: 200
        is_original:
          type: boolean
          title: Original?
        terms_accepted_at:
          type: string
          format: date-time
          readOnly: true
          title: Terms accepted
        images:
          type: array
          items:
            $ref: '#/components/schemas/ListingImage'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ListingStatusEnum'
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          title: Last status change
        offer_amount:
          type: string
          format: decimal
