          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/listings/{id}/complete/:
    post:
      operationId: listings_complete_create
      summary: Complete sale
      parameters:
      - in: path
        name: id
