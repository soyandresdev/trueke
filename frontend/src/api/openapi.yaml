components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        created:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - created
      - refresh
      - user
    AvailableActionsEnum:
      enum:
      - offer
      - accept
      - reject
      - pickup
      - complete
      - cancel
      type: string
      description: |-
        * `offer` - offer
        * `accept` - accept
        * `reject` - reject
        * `pickup` - pickup
        * `complete` - complete
        * `cancel` - cancel
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: Código
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        fields_schema:
          title: Campos extra
          description: JSON Schema (tipo object) con los campos propios de la categoría.
      required:
      - code
      - id
      - name
    ConditionEnum:
      enum:
      - new
      - like_new
      - good
      - fair
      - for_parts
      type: string
      description: |-
        * `new` - Nuevo
        * `like_new` - Como nuevo
        * `good` - Buen estado
        * `fair` - Con detalles
        * `for_parts` - Para repuestos
    DocumentTypeEnum:
      enum:
      - national_id
      - foreign_id
      - passport
      type: string
      description: |-
        * `national_id` - Documento nacional
        * `foreign_id` - Documento de extranjería
        * `passport` - Pasaporte
    KindEnum:
      enum:
      - listing.create
      - listing.offer
      - listing.accept
      - listing.reject
      - listing.pickup
      - listing.complete
      - listing.cancel
      - message.new
      type: string
      description: |-
        * `listing.create` - Nueva publicación
        * `listing.offer` - Nueva oferta
        * `listing.accept` - Oferta aceptada
        * `listing.reject` - Oferta rechazada
        * `listing.pickup` - Recogida coordinada
        * `listing.complete` - Venta completada
        * `listing.cancel` - Publicación cancelada
        * `message.new` - Mensajes nuevos
    LanguageEnum:
      enum:
      - es
      - en
      type: string
      description: |-
        * `es` - Español
        * `en` - English
    Listing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
