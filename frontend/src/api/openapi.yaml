          description: ''
  /api/listings/{id}/images/{image_id}/:
    delete:
      operationId: listings_images_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this listing.
        required: true
      - in: path
        name: image_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '204':
