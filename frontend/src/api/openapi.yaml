          description: ''
  /api/listings/{id}/cancel/:
    post:
      operationId: listings_cancel_create
      summary: Cancel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this listing.
        required: true
      tags:
